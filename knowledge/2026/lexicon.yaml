# Slovak terms, abbreviations and spelling variants mapped to concepts. Matched without
# diacritics or case, word by word; a trailing * matches any ending. A concept proposes
# economic classification codes (ek), the most likely first, and a short posting text.
# Concepts below weight 0.5 only add alternatives; concepts without ek steer analytic
# accounts (au_rules.yaml) and texts.

# Words too common to count when comparing an invoice with budget descriptions.
stopwords: [a, aj, alebo, na, za, do, od, po, pre, pri, so, s, v, vo, z, zo, k, ku, o, u,
  cislo, dph, eur, spolu, suma, sluzby, sluzba, sluzieb, ostatne, ostatny, vseobecne,
  vseobecny, poplatok, poplatky, faktura, fakturujem, fakturujeme, vam, zmysle, zmluvy,
  zmluva, zmluve, zaklade, obdobie, mesiac, polozka, celkom]

# A credit note is entered by hand (decision 12), so these send an invoice to manual entry.
credit_note_markers: ["dobropis*", "opravn* faktur*", "opravn* danov* doklad*", "storn* faktur*"]

