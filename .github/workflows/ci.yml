# CI (plan §13.3): the same checks as scripts/check.sh, split into jobs. The raw exports in
# ../data are absent here, so the tests that need them skip, as on a fresh clone. The ocr job
# reads the synthetic scans with Tesseract and fails below plan §8.6's targets.
name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "p2-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"
  FORCE_COLOR: "1"

jobs:
  backend-lint:
    name: backend-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # Astral publishes no moving major tag
        with:
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports

  backend-test:
    name: backend-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # Astral publishes no moving major tag
        with:
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # Coverage is enforced from P2-M1 (plan §13.2): 85% overall, 90% for the domain packages.
      - name: pytest (not ocr, not e2e) with coverage (85% overall)
        run: >-
          uv run pytest -m "not ocr and not e2e" --cov=riso --cov-report=term:skip-covered
          --cov-fail-under=85
      - name: coverage of the domain packages (90%)
        run: uv run coverage report --include='riso/*/domain/*' --skip-covered --fail-under=90
      - run: uv run riso check
      - name: schema drift
        run: uv run riso export-schemas --check
      - name: migrations upgrade to head and match the models
        run: |
          export RISO_VAR_DIR="$(mktemp -d)"
          uv run alembic upgrade head
          uv run alembic check

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      # check:api runs `riso export-openapi --check`, so the backend is needed too.
      - uses: astral-sh/setup-uv@v10.3.3 # Astral publishes no moving major tag
        with:
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: the API client matches riso export-openapi
        run: pnpm check:api

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.3.3 # Astral publishes no moving major tag
        with:
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      # The global setup migrates a temporary database and starts riso serve on a free port.
      - run: pnpm e2e
      - name: upload Playwright traces and report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ github.run_attempt }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  ocr:
    name: ocr
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # Astral publishes no moving major tag
        with:
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # The pinned tessdata_best models (27 MB; riso ocr setup checks their SHA-256).
      - name: cache the OCR models
        uses: actions/cache@v6
        with:
          path: var/tessdata
          key: tessdata-${{ hashFiles('riso/intake/infrastructure/tesseract.py') }}
      - run: uv run riso ocr setup
      # The scan generator renders in Python Playwright's Chromium.
      - name: install Chromium for the scan generator
        run: uv run playwright install --with-deps chromium
      - name: cache the synthetic scans
        id: scans
        uses: actions/cache@v6
        with:
          path: testdata/ocr/generated
          key: >-
            scans-${{ hashFiles('riso/testdata/**', 'testdata/fonts/**', 'data/invoices/**',
            'uv.lock') }}
      - name: generate the synthetic scans
        if: steps.scans.outputs.cache-hit != 'true'
        run: uv run riso testdata scans
      - run: uv run pytest -m ocr
      - name: measure the OCR against plan §8.6 (fails below the targets)
        run: uv run riso ocr-eval --set synthetic --json --strict > ocr-eval.json
      - name: upload the OCR report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ocr-eval-${{ github.run_attempt }}
          path: ocr-eval.json
          retention-days: 30
          if-no-files-found: ignore
