[project]
name = "riso"
version = "0.1.0"
description = "Demo engine that proposes the posting and budget coding of Slovak municipal supplier invoices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "openpyxl>=3.1",
    "pydantic>=2.9",
    "uvicorn>=0.30",
    "xlrd>=2.0",
]

[project.scripts]
riso = "riso.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["riso"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
